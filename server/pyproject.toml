[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferry-server"
version = "0.15.1"
description = "Ferry server: context engine and privacy gateway for the Ferry coding agent"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
ferry-server = "ferry_server.__main__:main"

[tool.setuptools.packages.find]
include = ["ferry_server*"]

[tool.setuptools.package-data]
ferry_server = ["admin.html"]
