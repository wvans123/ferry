name: release

# Push a tag like v0.4.1 (same as the version in package.json) to publish ferry-windows-<version>.zip.
# `ferry update` on the work PC downloads the newest one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check the tag matches the version
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - run: npm ci --omit=dev
      - name: build the offline Windows package
        run: python scripts/build_bundle.py --platform win
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ferry-windows-*.zip --title "Ferry $GITHUB_REF_NAME" --generate-notes
