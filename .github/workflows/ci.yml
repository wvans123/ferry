name: test and release

# Pull request: unit tests and the end-to-end self-test on Linux and Windows (skipped when only docs change).
# Push to main: if the commit is a pull request that already passed those tests with the same files, the tests
# are not run again. If package.json's version has no release yet, build the offline Windows package and
# publish release v<version> (that is what `ferry update` downloads). So releasing = bumping the version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  checks: read

# a new push to a pull request cancels its older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.g.outputs.test }}
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: do the tests need to run?
        id: g
        run: |
          # docs/, eval results and top-level .md files; a SKILL.md inside client/ is code (the agent reads it)
          docs_only() { ! grep -qvE '^(docs/|evals/results/|[^/]+\.md$)' "$1"; }
          verdict() { echo "test=$1" >> "$GITHUB_OUTPUT"; echo "tests: $1 ($2)"; }
          if [ "${{ github.event_name }}" = pull_request ]; then
            gh api --paginate "repos/$R/pulls/${{ github.event.number }}/files" --jq '.[].filename' > files
            if docs_only files; then verdict false "only docs changed"; else verdict true "code changed"; fi
            exit 0
          fi
          if [ "${{ github.event_name }}" != push ]; then verdict true "${{ github.event_name }}"; exit 0; fi
          sha=${{ github.sha }}
          gh api "repos/$R/commits/$sha" --jq '.files[].filename' > files
          if docs_only files; then verdict false "only docs changed"; exit 0; fi
          tree=$(gh api "repos/$R/commits/$sha" --jq .commit.tree.sha)
          head=$(gh api "repos/$R/commits/$sha/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')
          if [ -z "$head" ]; then verdict true "not from a pull request"; exit 0; fi
          if [ "$(gh api "repos/$R/commits/$head" --jq .commit.tree.sha)" != "$tree" ]; then
            verdict true "main moved after the pull request was tested"; exit 0
          fi
          ok=$(gh api "repos/$R/commits/$head/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name|startswith("test (")) | select(.conclusion=="success")] | length')
          if [ "$ok" -ge 2 ]; then verdict false "pull request $head passed on Linux and Windows"; else verdict true "pull request not tested"; fi

  test:
    needs: gate
    if: needs.gate.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e server pytest
      - name: unit tests
        run: |
          python -m pytest -q server/tests
          node --test "client/test/*.test.mjs"
      - name: end-to-end self-test (fake model, no API key)
        run: python selftest/run.py

  release:
    needs: [gate, test]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.gate.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: is this version released yet?
        id: v
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v already released"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.new == 'true'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: steps.v.outputs.new == 'true'
        with:
          python-version: "3.12"
      - if: steps.v.outputs.new == 'true'
        run: npm ci --omit=dev
      - name: build the offline Windows package
        if: steps.v.outputs.new == 'true'
        run: python scripts/build_bundle.py --platform win
      - name: publish
        if: steps.v.outputs.new == 'true'
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/ferry-windows-*.zip dist/ferry-app-*.zip dist/ferry-deps-*.json \
            --target "$GITHUB_SHA" --title "Ferry v${{ steps.v.outputs.version }}" --generate-notes
