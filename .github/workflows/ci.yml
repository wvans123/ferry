name: test and release

# Which tests run is decided by the gate job below (the selection itself is scripts/affected.py, which you also run
# locally before pushing: `python scripts/affected.py --base origin/main --run`).
#   Pull request, version unchanged (a feature): Linux only, only the tests the change touches. Nobody has to wait
#     long for it; the agent's own local run of the same command is what counts. Docs only: nothing.
#   Push to main after a feature merge: everything, on Linux and Windows, the whole self-test included. This is the
#     safety net, nobody waits for it, nothing is released by it.
#   Pull request that bumps the version (a release: the four version files and GOAL.md only): no tests when the
#     base commit on main has a full green run (both test jobs succeeded); otherwise everything.
#   Release merge push: no tests when it changes only those files and the commit before it has a full green run.
#     If package.json's version has no release yet, build the offline Windows package and publish release
#     v<version> (that is what `ferry update` downloads). The release job refuses when main's last full run is
#     not green. So releasing = bumping the version.
#   workflow_dispatch: everything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  checks: read

# a new push to a pull request cancels its older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.g.outputs.test }}
      mode: ${{ steps.g.outputs.mode }}
      os: ${{ steps.g.outputs.os }}
      base: ${{ steps.g.outputs.base }}
      green: ${{ steps.g.outputs.green }}
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: do the tests need to run, and which?
        id: g
        run: |
          # docs/, eval results and top-level .md files; a SKILL.md inside client/ is code (the agent reads it)
          docs_only() { ! grep -qvE '^(docs/|evals/results/|[^/]+\.md$)' "$1"; }
          # what a version bump touches (plus GOAL.md's last-result line)
          bump_only() { ! grep -qvE '^(package\.json|package-lock\.json|server/pyproject\.toml|server/ferry_server/__init__\.py|GOAL\.md)$' "$1"; }
          skippable() { ! grep -qvE '^(docs/|evals/results/|[^/]+\.md$|package\.json|package-lock\.json|server/pyproject\.toml|server/ferry_server/__init__\.py)' "$1"; }
          # verdict <run tests?> <affected|all> <reason>: "all" is every unit test and the whole self-test, on both systems
          verdict() {
            echo "test=$1" >> "$GITHUB_OUTPUT"; echo "mode=$2" >> "$GITHUB_OUTPUT"
            if [ "$2" = all ]; then echo 'os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"; else echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"; fi
            echo "tests: $1, mode: $2 ($3)"
          }
          ver() { gh api -H "Accept: application/vnd.github.raw+json" "repos/$R/contents/package.json?ref=$1" | jq -r .version; }
          # green <sha>: the last full run on main at or before this commit succeeded on both systems. Commits that
          # only change docs or version files have no run of their own, so look at the one before them.
          green() {
            local s=$1 i runs
            for i in $(seq 1 15); do
              runs=$(gh api "repos/$R/commits/$s/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name|startswith("test ("))] | group_by(.name) | map(sort_by(.started_at)|last)')
              if [ "$(jq length <<<"$runs")" -gt 0 ]; then
                [ "$(jq '[.[] | select(.conclusion=="success")] | length' <<<"$runs")" -ge 2 ]; return
              fi
              gh api "repos/$R/commits/$s" --jq '.files[].filename' > cfiles
              skippable cfiles || return 1
              s=$(gh api "repos/$R/commits/$s" --jq '.parents[0].sha')
            done
            return 1
          }
          echo "green=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            gh api --paginate "repos/$R/pulls/${{ github.event.number }}/files" --jq '.[].filename' > files
            if docs_only files; then verdict false affected "only docs changed"; exit 0; fi
            if [ "$(ver ${{ github.event.pull_request.head.sha }})" != "$(ver ${{ github.event.pull_request.base.sha }})" ]; then
              if bump_only files && green ${{ github.event.pull_request.base.sha }}; then
                verdict false affected "a release, and main's last full run is green"
              else
                verdict true all "a release, and main is not known to be green or other files changed"
              fi
            else
              verdict true affected "a feature: only the tests the change touches, on Linux"
            fi
            exit 0
          fi
          if [ "${{ github.event_name }}" != push ]; then verdict true all "${{ github.event_name }}"; exit 0; fi
          sha=${{ github.sha }}
          parent=$(gh api "repos/$R/commits/$sha" --jq '.parents[0].sha')
          gh api "repos/$R/commits/$sha" --jq '.files[].filename' > files
          g=false; if green "$parent"; then g=true; fi
          echo "green=$g" >> "$GITHUB_OUTPUT"
          if docs_only files; then verdict false affected "only docs changed"; exit 0; fi
          if [ "$(ver $sha)" != "$(ver "$parent")" ] && bump_only files && [ "$g" = true ]; then
            verdict false affected "a release merge, and main was green before it"; exit 0
          fi
          verdict true all "everything: the safety net after a merge"

  test:
    needs: gate
    if: needs.gate.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e server pytest
      - name: tests
        run: |
          if [ "${{ needs.gate.outputs.mode }}" = all ]; then
            python scripts/affected.py --all --run
          else
            python scripts/affected.py --base "${{ needs.gate.outputs.base }}" --run
          fi
        shell: bash

  release:
    needs: [gate, test]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.gate.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: is this version released yet?
        id: v
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v already released"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: main's last full run must be green
        if: steps.v.outputs.new == 'true' && needs.test.result != 'success' && needs.gate.outputs.green != 'true'
        run: echo "main's last full run is not green; fix it or re-run this workflow" && exit 1
      - uses: actions/setup-node@v4
        if: steps.v.outputs.new == 'true'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: steps.v.outputs.new == 'true'
        with:
          python-version: "3.12"
      - if: steps.v.outputs.new == 'true'
        run: npm ci --omit=dev
      - name: build the offline Windows package
        if: steps.v.outputs.new == 'true'
        run: python scripts/build_bundle.py --platform win
      - name: publish
        if: steps.v.outputs.new == 'true'
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/ferry-windows-*.zip dist/ferry-app-*.zip dist/ferry-deps-*.json \
            --target "$GITHUB_SHA" --title "Ferry v${{ steps.v.outputs.version }}" --generate-notes
